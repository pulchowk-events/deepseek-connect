<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>deepseek-connect</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; flex: none; }
    .dot.green { background: #22c55e; }
    .dot.yellow { background: #eab308; }
    .dot.red { background: #ef4444; }
    label { display: block; font-size: 11px; color: #555; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 4px 6px; font: inherit; }
    button { font: inherit; padding: 4px 8px; cursor: pointer; }
    #msg { font-size: 11px; color: #666; margin-top: 6px; min-height: 14px; }
    #current { font-size: 11px; color: #444; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="row">
    <span id="dot" class="dot"></span>
    <strong id="status">disconnected</strong>
  </div>
  <div id="current"></div>

  <label for="token">Token</label>
  <input id="token" type="text" placeholder="EXTENSION_TOKEN">
  <label for="port">Port</label>
  <input id="port" type="text" placeholder="7331">
  <div class="row" style="margin-top:8px;">
    <button id="save">Save</button>
    <button id="skip">Skip site</button>
  </div>
  <div id="msg"></div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
