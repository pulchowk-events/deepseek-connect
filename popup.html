<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>deepseek-connect</title>
  <style>
    :root { color-scheme: light; }
    body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 320px; margin: 0; padding: 16px; color: #172033; background: #f8fafc; }
    .header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .brand { font-size: 15px; font-weight: 700; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(15,23,42,.04); }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; flex: none; box-shadow: 0 0 0 3px #f1f5f9; }
    .dot.green { background: #22c55e; }
    .dot.yellow { background: #eab308; }
    .dot.red { background: #ef4444; }
    label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin: 10px 0 5px; }
    input { width: 100%; box-sizing: border-box; height: 34px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 9px; font: inherit; background: #fff; }
    input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    button { min-height: 32px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #334155; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #f1f5f9; }
    button.primary { border-color: #4f46e5; background: #4f46e5; color: #fff; }
    button.primary:hover { background: #4338ca; }
    #msg { font-size: 11px; color: #64748b; margin-top: 8px; min-height: 14px; line-height: 1.35; }
    #current { font-size: 11px; color: #64748b; margin-top: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <span id="dot" class="dot"></span>
    <div><div class="brand">deepseek-connect</div><strong id="status">disconnected</strong></div>
  </div>
  <div class="card">
    <div id="current"></div>
    <label for="token">Extension token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="EXTENSION_TOKEN">
    <label for="port">Local server port</label>
    <input id="port" type="number" inputmode="numeric" min="1" max="65535" placeholder="7331">
    <div class="actions">
      <button id="save" class="primary">Save</button>
      <button id="providers">Providers</button>
    </div>
    <button id="skip" style="width:100%; margin-top:8px;">Skip current provider tab</button>
    <div id="msg"></div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
